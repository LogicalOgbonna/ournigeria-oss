services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ournigeria_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spending
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [database]

  api:
    image: ournigeria/api:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PORT: ${API_PORT:-3000}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    environment:
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - DATABASE_URL=postgresql://spending:${POSTGRES_PASSWORD}@postgres:5432/spending
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-3000}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [frontend, backend, database]

  web:
    image: ournigeria/web:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INFISICAL_TOKEN: ${INFISICAL_TOKEN}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${WEB_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [frontend]

  ingest:
    image: ournigeria/ingest:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${INGEST_PORT:-3002}:3002"
    environment:
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - DATABASE_URL=postgresql://spending:${POSTGRES_PASSWORD}@postgres:5432/spending
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [backend, database]

  dashboard:
    image: ournigeria/dashboard:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${DASHBOARD_PORT:-3003}:3003"
    environment:
      - API_URL=http://api:${API_PORT:-3000}
      - INGEST_URL=http://ingest:${INGEST_PORT:-3002}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      api:
        condition: service_healthy
      ingest:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [frontend, backend]

networks:
  frontend:
  backend:
  database:

volumes:
  pgdata:
