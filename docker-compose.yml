services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: naija-budget-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: spending
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: spending
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
