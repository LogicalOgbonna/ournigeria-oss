# ── Shared service configs (YAML anchors) ─────────────────────────
x-api-common: &api-common
  image: ghcr.io/${GHCR_OWNER:-ournigeria}/ournigeria-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    - INFISICAL_TOKEN=${INFISICAL_TOKEN}
    - INFISICAL_ENV=${INFISICAL_ENV:-prod}
    - DATABASE_URL=postgresql://spending:${POSTGRES_PASSWORD}@postgres:5432/spending
    - PORT=3000
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "1.0"
      reservations:
        memory: 512M
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  networks: [internal]

x-ingest-common: &ingest-common
  image: ghcr.io/${GHCR_OWNER:-ournigeria}/ournigeria-ingest:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    - INFISICAL_TOKEN=${INFISICAL_TOKEN}
    - INFISICAL_ENV=${INFISICAL_ENV:-prod}
    - DATABASE_URL=postgresql://spending:${POSTGRES_PASSWORD}@postgres:5432/spending
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 15s
  deploy:
    resources:
      limits:
        memory: 4G
        cpus: "2.0"
      reservations:
        memory: 1G
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  networks: [internal]

services:
  # ─── Database (unchanged) ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ournigeria_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spending
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [internal]

  # ─── Graph Database ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: ournigeria_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks: [internal]

  # ─── Reverse Proxy (HTTP-only, behind NPM) ─────────────────────
  traefik:
    image: traefik:v3.3
    container_name: ournigeria_traefik
    restart: unless-stopped
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
      - "--log.level=WARN"
      - "--ping=true"
      - "--ping.entrypoint=web"
    ports:
      - "80:80"
    networks:
      - internal
      - npm-proxy
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── API (Blue/Green) ──────────────────────────────────────────
  api-blue:
    <<: *api-common
    container_name: ournigeria_api_blue

  api-green:
    <<: *api-common
    container_name: ournigeria_api_green

  # ─── Ingest (Blue/Green) ───────────────────────────────────────
  ingest-blue:
    <<: *ingest-common
    container_name: ournigeria_ingest_blue

  ingest-green:
    <<: *ingest-common
    container_name: ournigeria_ingest_green

  # ─── Webhook Receiver ──────────────────────────────────────────
  webhook:
    build:
      context: ./deploy
      dockerfile: Dockerfile.webhook
    container_name: ournigeria_webhook
    restart: unless-stopped
    command: ["-hooks", "/etc/webhook/hooks.yaml", "-port", "9000", "-verbose", "-template"]
    ports:
      - "${WEBHOOK_PORT:-9000}:9000"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - STATUS_BEARER_TOKEN=${STATUS_BEARER_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_DEPLOY_CHAT_ID=${TELEGRAM_DEPLOY_CHAT_ID:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
      - /opt/ournigeria:/opt/ournigeria
      - /var/log/ournigeria-deploy:/var/log/ournigeria-deploy
      - ./deploy/hooks.yaml:/etc/webhook/hooks.yaml:ro
    networks:
      - internal
      - npm-proxy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:

networks:
  internal:
  npm-proxy:
    external: true
