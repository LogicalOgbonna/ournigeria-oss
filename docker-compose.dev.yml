services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ournigeria_db
    environment:
      POSTGRES_DB: spending
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: spending
    ports:
      - "5432:5432"
    volumes:
      - ./packages/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending"]
      interval: 5s
      timeout: 5s
      retries: 5
