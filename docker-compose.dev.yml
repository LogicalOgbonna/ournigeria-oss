services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ournigeria_db
    environment:
      POSTGRES_DB: spending
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: spending
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./packages/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ournigeria_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphpass}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j_dev_data:/data
      - neo4j_dev_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-graphpass}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  neo4j_dev_data:
  neo4j_dev_logs:
