# Sandboxed enrichment stack (local / prod-parity).
#
# - agent: official Hermes image + bundled CLIs, single-purpose home on a named volume.
#   No host filesystem mounts → the agent's `terminal` toolset is confined to the container.
# - camofox: headless anti-detect browser, reachable only over the private `enrichment` net.
#
# Local wiring: the agent also joins the dev DB's network (spending_default) to reach
# `ournigeria_db:5432` as the least-privileged `enrichment_agent` role. For prod, swap the
# `devdb` external network for the production stack's `internal` network + DB host.
#
# Secrets come from deploy/enrichment/.env (gitignored). Copy .env.example to start.
name: ournigeria-enrichment

services:
  camofox:
    build:
      context: ../..
      dockerfile: deploy/enrichment/Dockerfile.camofox
    image: ournigeria-enrichment-camofox
    container_name: enrichment_camofox
    restart: unless-stopped
    networks: [enrichment]
    # No published ports — only the agent reaches it via the enrichment network.

  agent:
    build:
      context: ../..
      dockerfile: deploy/enrichment/Dockerfile.agent
    image: ournigeria-enrichment-agent
    container_name: enrichment_agent
    restart: unless-stopped
    depends_on: [camofox]
    # Secrets come from Infisical, injected at up-time:
    #   infisical run --env dev -- docker compose -f deploy/enrichment/docker-compose.yml up -d
    # The ${VAR:?} guards fail fast if a secret wasn't injected (i.e. you forgot `infisical run`).
    # Telegram names are mapped from ENRICHMENT_*-namespaced Infisical secrets so the agent
    # never reuses the app's shared TELEGRAM_BOT_TOKEN (used by the API for Telegram login).
    environment:
      TELEGRAM_BOT_TOKEN: "${ENRICHMENT_TELEGRAM_BOT_TOKEN:?set-via-infisical-run}"
      TELEGRAM_ALLOWED_USERS: "${ENRICHMENT_TELEGRAM_ALLOWED_USERS:?set-via-infisical-run}"
      # Split engines: DeepSeek = reasoning brain, GLM (z.ai) = vision auxiliary.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set-via-infisical-run}"
      ZAI_API_KEY: "${ZAI_API_KEY:?set-via-infisical-run}"
      ENRICHMENT_AGENT_DATABASE_URL: "${ENRICHMENT_AGENT_DATABASE_URL:?set-via-infisical-run}"
      # Optional: CourtListener API token (plan 59) — lifts the 50/hr search cap for
      # the courtlistener-lookup CLI. Absent = keyless single lookups still work.
      COURTLISTENER_TOKEN: "${COURTLISTENER_TOKEN:-}"
      CAMOFOX_URL: "http://camofox:9377"
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - enrichment_home:/opt/data   # Hermes home — a named volume, never a host path.
    networks: [enrichment, devdb]
    command: ["gateway", "run"]

  # Autonomous structured-data sweeper (control plane). Opt-in via the `sweeper`
  # compose profile so it never auto-starts until you enable it:
  #   infisical run --env dev -- docker compose -f deploy/enrichment/docker-compose.yml --profile sweeper up -d sweeper
  # Reuses the agent image (has node + bundled tools + the hermes binary) but
  # bypasses the gateway entrypoint to run the sweeper directly. Shares the agent's
  # seeded Hermes home (skills/config/.env) so its per-gap `hermes -z` calls work.
  sweeper:
    image: ournigeria-enrichment-agent
    container_name: enrichment_sweeper
    restart: unless-stopped
    profiles: ["sweeper"]
    depends_on: [agent, camofox]
    user: "10000:10000"
    entrypoint: ["node"]
    command: ["/opt/enrichment-tools/sweeper.cjs"]
    environment:
      HERMES_HOME: "/opt/data"
      OPENAI_API_KEY: "${DEEPSEEK_API_KEY:?set-via-infisical-run}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set-via-infisical-run}"
      ZAI_API_KEY: "${ZAI_API_KEY:?set-via-infisical-run}"
      ENRICHMENT_AGENT_DATABASE_URL: "${ENRICHMENT_AGENT_DATABASE_URL:?set-via-infisical-run}"
      # Optional: CourtListener API token (plan 59) — lifts the 50/hr search cap for
      # the courtlistener-lookup CLI. Absent = keyless single lookups still work.
      COURTLISTENER_TOKEN: "${COURTLISTENER_TOKEN:-}"
      CAMOFOX_URL: "http://camofox:9377"
      # Conservative defaults — override per environment.
      SWEEPER_BATCH: "${SWEEPER_BATCH:-5}"
      SWEEPER_PACE_MS: "${SWEEPER_PACE_MS:-90000}"
      SWEEPER_IDLE_MS: "${SWEEPER_IDLE_MS:-900000}"
      SWEEPER_DAILY_CAP: "${SWEEPER_DAILY_CAP:-100}"
      SWEEPER_RECHECK_FILLED_DAYS: "${SWEEPER_RECHECK_FILLED_DAYS:-180}"
      SWEEPER_RECHECK_NOTHING_DAYS: "${SWEEPER_RECHECK_NOTHING_DAYS:-90}"
      SWEEPER_RECHECK_ERROR_DAYS: "${SWEEPER_RECHECK_ERROR_DAYS:-1}"
      # Kill switch: set SWEEPER_KILL=1 (or touch the kill file in the volume) to halt.
      SWEEPER_KILL: "${SWEEPER_KILL:-0}"
      SWEEPER_KILL_FILE: "/opt/data/enrichment-sweeper.kill"
    volumes:
      - enrichment_home:/opt/data   # shared with agent → seeded skills/config/.env
    networks: [enrichment, devdb]

networks:
  enrichment:
    driver: bridge
  devdb:
    external: true
    name: spending_default

volumes:
  enrichment_home:
