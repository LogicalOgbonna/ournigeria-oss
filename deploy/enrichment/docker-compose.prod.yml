# Prod override for the enrichment stack.
# Only difference vs the dev compose: the agent's DB network is the prod stack's
# `ournigeria_internal` (where the DB resolves as `postgres`) instead of dev `spending_default`.
# Run from a host that has the repo + Infisical, targeting the prod Docker daemon:
#   DOCKER_HOST=ssh://ournigeria infisical run --env prod --path /enrichment -- \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Secrets inject from Infisical into the container env; nothing is written to the box's /opt/ournigeria/.env.
networks:
  devdb:
    external: true
    name: ournigeria_internal
