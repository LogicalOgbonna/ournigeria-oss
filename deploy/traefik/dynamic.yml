# This file is managed by deploy.sh — do not edit manually
# deploy.sh copies dynamic-blue.yml or dynamic-green.yml here
# Traefik watches this file for hot-reload

http:
  routers:
    api:
      rule: "Host(`api.ournigeria.ng`)"
      service: api
      entryPoints:
        - websecure
      tls:
        certResolver: le

    ingest:
      rule: "Host(`ingest.ournigeria.ng`)"
      service: ingest
      entryPoints:
        - websecure
      tls:
        certResolver: le

    socials:
      rule: "Host(`socials.ournigeria.ng`)"
      service: socials
      entryPoints:
        - websecure
      tls:
        certResolver: le

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api-blue:3000"

    ingest:
      loadBalancer:
        servers:
          - url: "http://ingest-blue:3002"

    socials:
      loadBalancer:
        servers:
          - url: "http://socials-blue:3005"
