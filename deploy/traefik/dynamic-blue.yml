# Traefik dynamic config — BLUE stack active
# This file is a template. deploy.sh copies it to dynamic.yml
# Traefik watches dynamic.yml for hot-reload (no restart needed)

http:
  routers:
    api:
      rule: "Host(`api.example.invalid`)"
      service: api
      entryPoints:
        - web

    ingest:
      rule: "Host(`ingest.example.invalid`)"
      service: ingest
      entryPoints:
        - web

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api-blue:3000"

    ingest:
      loadBalancer:
        servers:
          - url: "http://ingest-blue:3002"
