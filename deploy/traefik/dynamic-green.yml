# Traefik dynamic config — GREEN stack active
# This file is a template. deploy.sh copies it to dynamic.yml
# Traefik watches dynamic.yml for hot-reload (no restart needed)

http:
  routers:
    api:
      rule: "Host(`api.ournigeria.ng`)"
      service: api
      entryPoints:
        - websecure
      tls:
        certResolver: le

    ingest:
      rule: "Host(`ingest.ournigeria.ng`)"
      service: ingest
      entryPoints:
        - websecure
      tls:
        certResolver: le

    socials:
      rule: "Host(`socials.ournigeria.ng`)"
      service: socials
      entryPoints:
        - websecure
      tls:
        certResolver: le

    deploy:
      rule: "Host(`deploy.ournigeria.ng`)"
      service: webhook
      entryPoints:
        - websecure
      tls:
        certResolver: le

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api-green:3000"

    ingest:
      loadBalancer:
        servers:
          - url: "http://ingest-green:3002"

    socials:
      loadBalancer:
        servers:
          - url: "http://socials-green:3005"

    webhook:
      loadBalancer:
        servers:
          - url: "http://webhook:9000"
