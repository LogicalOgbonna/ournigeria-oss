name: Build & Deploy

on:
  push:
    branches: [main, staging]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: Lint deploy scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/*.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, ingest]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ournigeria-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Get image size
        if: github.event_name != 'pull_request'
        id: size
        run: |
          SIZE=$(docker image inspect ghcr.io/${{ github.repository_owner }}/ournigeria-${{ matrix.app }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --format '{{.Size}}' 2>/dev/null || echo "0")
          echo "size_mb=$(echo "scale=1; $SIZE/1048576" | bc)" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          BODY=$(printf '{"ref":"%s","sha":"%s","timestamp":"%s"}' \
            "${{ github.ref }}" "${{ github.sha }}" "$(date +%s)")
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')

          curl -f -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: push" \
            --data "$BODY" \
            --max-time 30 \
            --retry 2

  pr-comment:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment build info on PR
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const owner = context.repo.owner;
            const body = [
              '### 🐳 Docker Build Complete',
              '',
              '| Image | Tag |',
              '|-------|-----|',
              `| \`ghcr.io/${owner}/ournigeria-api\` | \`sha-${sha}\` |`,
              `| \`ghcr.io/${owner}/ournigeria-ingest\` | \`sha-${sha}\` |`,
              '',
              `Built from commit \`${sha}\`. Images are **not pushed** for PR builds.`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
