name: Build & Deploy

on:
  push:
    branches: [main, staging, prod]
    tags: ['v*']
  pull_request:
    branches: [main, staging, prod]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Force-build all apps (ignore nx-affected)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: Lint deploy scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/*.sh

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine affected apps
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            echo "api=true"     >> "$GITHUB_OUTPUT"
            echo "ingest=true"  >> "$GITHUB_OUTPUT"
            echo "socials=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            BASE="HEAD~1"
          fi
          AFFECTED=$(pnpm exec nx show projects --affected --base="$BASE" --head=HEAD 2>/dev/null || echo "")
          echo "Affected projects: $AFFECTED"
          echo "api=$(echo "$AFFECTED" | grep -q '^api$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ingest=$(echo "$AFFECTED" | grep -q '^ingest$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "socials=$(echo "$AFFECTED" | grep -q '^socials$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: set-matrix
        run: |
          APPS=()
          [ "${{ steps.affected.outputs.api }}" = "true" ] && APPS+=("api")
          [ "${{ steps.affected.outputs.ingest }}" = "true" ] && APPS+=("ingest")
          [ "${{ steps.affected.outputs.socials }}" = "true" ] && APPS+=("socials")
          if [ ${#APPS[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "No Docker apps affected — skipping build"
          else
            MATRIX=$(printf '%s\n' "${APPS[@]}" | jq -R . | jq -sc .)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            echo "Apps to build: $MATRIX"
          fi

  build:
    needs: [validate, detect-changes]
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Don't let one app's build failure (e.g. socials OOM under QEMU) cancel the
      # healthy legs and skip the deploy. Each app builds/deploys independently.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5

      # socials' multi-arch image (amd64 + emulated arm64) plus the GHA layer
      # cache (cache-to mode=max writes every layer of both arches) overflows the
      # ~14GB free disk on ubuntu-latest → "No space left on device" during build.
      # api/ingest are lighter and slip under the limit; socials is the one that
      # tips over. Reclaim ~25GB of preinstalled toolchains this job never uses.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ournigeria-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # arm64 builds use QEMU emulation and are slower; the GHA cache mitigates repeat builds.
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Get image size
        if: github.event_name != 'pull_request'
        id: size
        run: |
          SIZE=$(docker image inspect ghcr.io/${{ github.repository_owner }}/ournigeria-${{ matrix.app }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --format '{{.Size}}' 2>/dev/null || echo "0")
          echo "size_mb=$(echo "scale=1; $SIZE/1048576" | bc)" >> $GITHUB_OUTPUT

  deploy:
    needs: [detect-changes, build]
    # !cancelled() lets the deploy webhook fire even if SOME build legs failed
    # (e.g. socials OOMs under QEMU) — the box's blue/green keeps the old image
    # for any app that didn't produce a fresh one, while healthy apps roll forward.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          OLD_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          OLD_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          OCI_WEBHOOK_SECRET: ${{ secrets.OCI_WEBHOOK_SECRET }}
          OCI_WEBHOOK_URL: ${{ secrets.OCI_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            WEBHOOK_SECRET="$OCI_WEBHOOK_SECRET"; DEPLOY_WEBHOOK_URL="$OCI_WEBHOOK_URL"
            echo "Deploying to OCI prod box"
          else
            WEBHOOK_SECRET="$OLD_WEBHOOK_SECRET"; DEPLOY_WEBHOOK_URL="$OLD_WEBHOOK_URL"
            echo "Deploying to legacy box"
          fi
          BODY=$(printf '{"ref":"%s","sha":"%s","timestamp":"%s"}' \
            "${{ github.ref }}" "${{ github.sha }}" "$(date +%s)")
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          curl -f -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: push" \
            --data "$BODY" \
            --max-time 30 \
            --retry 2

  pr-comment:
    needs: [detect-changes, build]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment build info on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const owner = context.repo.owner;
            const matrix = ${{ needs.detect-changes.outputs.matrix }};
            const rows = matrix.map(app =>
              `| \`ghcr.io/${owner}/ournigeria-${app}\` | \`sha-${sha}\` |`
            ).join('\n');
            const body = [
              '### 🐳 Docker Build Complete',
              '',
              '| Image | Tag |',
              '|-------|-----|',
              rows,
              '',
              `Built from commit \`${sha}\`. Images are **not pushed** for PR builds.`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
