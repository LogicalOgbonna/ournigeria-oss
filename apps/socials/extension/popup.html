<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OurNigeria — Session Capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { width: 380px; padding: 14px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      h1 { font-size: 14px; font-weight: 700; }
      .lede { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0 0 12px; }
      .cards { display: flex; flex-direction: column; gap: 8px; }
      .acct-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .handle { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
      .card .chips { margin: 8px 0; }
      .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
      .config { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
      .config label { margin-top: 10px; }
      .footer { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .footer .spacer { flex: 1; }
      .empty {
        text-align: center; padding: 20px 12px; color: var(--muted);
        font-size: 12px; line-height: 1.6;
      }
      .empty .em { color: var(--emerald-strong); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="brand-logo" src="icon48.png" alt="OurNigeria" />
        <h1>Session Capture</h1>
      </div>
      <button id="open-options" class="secondary">Open full tracker →</button>
    </header>

    <p class="lede">
      Passive. Stay logged into your bot accounts and use x.com normally — run one
      search, open one tweet. Sessions appear here on their own.
    </p>

    <div id="empty" class="empty hidden">
      No accounts captured yet.<br />
      Log into x.com and <span class="em">run a search</span> — this browser will
      pick up the session automatically.
    </div>

    <div id="cards" class="cards"></div>

    <div class="config">
      <label for="endpoint-input">Backend endpoint (POST /v1/sessions)</label>
      <input id="endpoint-input" type="text" placeholder="http://localhost:3005/v1/sessions" />
      <label for="roamer-key-input">X-Roamer-Key</label>
      <input id="roamer-key-input" type="password" placeholder="ROAMER_INGEST_KEY" />
    </div>

    <div class="footer">
      <button id="send-all" class="primary">Send all ready</button>
      <span class="spacer"></span>
      <span id="toast" class="toast hidden"></span>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
