<!DOCTYPE html>
<!--
  Roadmap OG card — pixel replica of Figma node 524:291 (Our Nigeria / Roadmap).
  Built at native Figma coordinates (3099x1522) and scaled to a 1200x630 stage
  (scale by height 0.4139, symmetric horizontal crop of ~41px per side).
  Screenshot the #stage element to bake opengraph-image.png.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#111}
  #stage{width:1200px;height:630px;overflow:hidden;position:relative}
  #inner{width:3099px;height:1522px;position:absolute;left:-41.5px;top:0;
    transform:scale(0.41393);transform-origin:0 0;background:#061510}
  .abs{position:absolute}
</style>
</head>
<body>
<div id="stage">
<div id="inner">
  <!-- Nigeria map, right side -->
  <img class="abs" src="nigeria2.svg" style="left:1953.9px;top:186.03px;width:963.712px;height:776.842px">
  <!-- winding roads -->
  <img class="abs" src="vector401.svg" style="left:883.63px;top:929.21px;width:3048.713px;height:1515.676px">
  <img class="abs" src="vector403.svg" style="left:1994.35px;top:932.78px;width:608.271px;height:1663.932px">
  <!-- contour waves bottom-left -->
  <div class="abs" style="left:-673px;top:554px;width:1988.252px;height:1708.85px;display:flex;align-items:center;justify-content:center">
    <img src="union.svg" style="width:1812.369px;height:1488.828px;transform:rotate(7.36deg)">
  </div>
  <!-- logo -->
  <img class="abs" src="ournigi.svg" style="left:317px;top:162.2px;width:528.874px;height:147.209px">
  <!-- display -->
  <div class="abs" style="left:321px;top:394px;transform:rotate(-2.5deg)">
    <div style="display:flex;align-items:center;border:6px solid #31ffbf;border-radius:28px;padding:38px 64px;background:rgba(49,255,191,.07)">
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:98px;letter-spacing:18px;color:#31ffbf">ROADMAP</div>
    </div>
  </div>
  <!-- headline + subline: same copy and type treatment as the original satori card
       (Instrument Serif headline, DM Sans subline, serif stats + mono labels) -->
  <div class="abs" style="left:321px;top:706px;width:1400px;font-family:'Instrument Serif',serif;font-size:152px;line-height:1.06;letter-spacing:-2px;color:#fff">The road to accountability runs <span style="color:#31ffbf">ward by ward.</span></div>
  <div class="abs" style="left:321px;top:1072px;width:1330px;font-family:'DM Sans',sans-serif;font-weight:400;font-size:57px;line-height:1.42;color:rgba(255,255,255,.72)">Next stops: elections, the police chain, your clinics and schools — then you.</div>
  <!-- stats -->
  <div class="abs" style="left:321px;top:1268px;display:flex;gap:100px">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div style="font-family:'Instrument Serif',serif;font-size:100px;line-height:1;color:#fff">8,807</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:34px;letter-spacing:4px;color:rgba(255,255,255,.55)">WARDS MAPPED</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div style="font-family:'Instrument Serif',serif;font-size:100px;line-height:1;color:#fff">774</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:34px;letter-spacing:4px;color:rgba(255,255,255,.55)">LOCAL GOVTS</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div style="font-family:'Instrument Serif',serif;font-size:100px;line-height:1;color:#fff">2,317</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:34px;letter-spacing:4px;color:rgba(255,255,255,.55)">SEATS MAPPED</div>
    </div>
  </div>
  <!-- NB: the Figma layer "image 1" is a Snappa safe-zone template guide
       (designer's positioning aid), not part of the visual. Excluded. -->
  <!-- grain omitted: noise defeats PNG compression and WhatsApp drops preview images over ~300KB -->
</div>
</div>
</body>
</html>
